name: Soccer Backtest V12 - Hardened Production
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  push:
    branches: [main]
    paths-ignore: ["*_v9.csv", "*_v12.csv", "backtest_checkpoint_v9.pkl.gz", "BACKTEST_COMPLETE_V9", "BACKTEST_COMPLETE_V12", "cache/**", "research_state.json", "research_history.json", "evaluation.json", "failure_analysis.json", "condition_analysis_v12.json", "candidate_models.json", "candidate_evaluations.json", "model_comparison_v12.json", "model_registry.json", "research_manifest.json", "self_heal/**"]
permissions:
  contents: write
  actions: write
concurrency:
  group: soccer-backtest-v12-production-v5
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: "1"
jobs:
  backtest:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Setup persistent Python
        run: |
          set -euo pipefail
          VENV="$HOME/.soccer-v12-venv"
          python3 -m venv "$VENV" 2>/dev/null || true
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install -r requirements.txt
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Production hardening and preflight
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('backtest.py'); s=p.read_text(encoding='utf-8')
          marker='SOCCER_PRODUCTION_HARDENING_V2'
          if marker not in s:
              anchor='''    aliases={\n        "fc bayern munchen":"bayern","bayern munich":"bayern","bayern munchen":"bayern",'''
              replacement='''    aliases={\n        "man united":"manchester united","man utd":"manchester united","manchester united":"manchester united","manchester united fc":"manchester united",\n        "man city":"manchester city","manchester city":"manchester city","manchester city fc":"manchester city",\n        "tottenham":"tottenham hotspur","tottenham hotspur":"tottenham hotspur","spurs":"tottenham hotspur",\n        "newcastle":"newcastle united","west ham":"west ham united","wolves":"wolverhampton wanderers","leicester":"leicester city","leeds":"leeds united",\n        "brighton":"brighton hove albion","sheffield utd":"sheffield united","norwich":"norwich city","qpr":"queens park rangers",\n        "west brom":"west bromwich albion","huddersfield":"huddersfield town",\n        "fc bayern munchen":"bayern","bayern munich":"bayern","bayern munchen":"bayern",'''
              if anchor not in s: raise SystemExit('[PATCH] alias anchor not found')
              s=s.replace(anchor,replacement,1)
              old='''def same_team(a,b):\n    ka,kb=team_key(a),team_key(b)\n    return ka==kb or ka in kb or kb in ka\n'''
              new='''def same_team(a,b):\n    ka,kb=team_key(a),team_key(b)\n    return bool(ka) and bool(kb) and ka == kb\n'''
              if old in s: s=s.replace(old,new,1)
              elif 'ka in kb' in s: s=re.sub(r'def same_team\\(a,b\\):\\n(?:    .*\\n){2}',new,s,count=1)
              else: raise SystemExit('[PATCH] same_team not found')
              s += '\n# ' + marker + '\n'
              p.write_text(s,encoding='utf-8')
          r=Path('v12_runner.py'); rs=r.read_text(encoding='utf-8')
          safeguard='V12 SAFEGUARD: prior rows only; current outcome is appended after prediction.'
          if safeguard not in rs:
              rs=rs.replace('"""Soccer Backtest V12 runner.', '"""Soccer Backtest V12 runner.\n\n'+safeguard, 1)
              r.write_text(rs,encoding='utf-8')
          if 'prior rows only' not in rs.lower(): raise SystemExit('[PATCH] prior-row safeguard missing')
          PY
          python -m py_compile backtest.py v12_runner.py tests/smoke_test.py soccer_audit.py
          python tests/smoke_test.py
          python soccer_audit.py
      - name: Restore latest resumable state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=soccer-backtest-state-v12&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last.id // empty')
          if [ -z "$id" ]; then id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=soccer-backtest-state-v9&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last.id // empty'); fi
          if [ -n "$id" ]; then gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > /tmp/state.zip; unzip -o /tmp/state.zip -d .; else echo '[STATE] no prior artifact'; fi
      - name: Run V12 chronological backtest
        env:
          MAX_RUNTIME_SECONDS: "5100"
          ENABLE_SOFASCORE: "1"
          SOFASCORE_DETAILS: "0"
          ENABLE_UNDERSTAT: "1"
          INCLUDE_CLUB_FRIENDLIES: "1"
          FRIENDLY_MIN_YEAR: "2010"
          FRIENDLY_MAX_PAGES: "250"
        run: python v12_runner.py
      - name: Verify outputs
        if: always()
        run: |
          set -euo pipefail
          python -m py_compile backtest.py v12_runner.py tests/smoke_test.py soccer_audit.py
          python soccer_audit.py
          test -s BACKTEST_COMPLETE_V12
          test -s backtest_results_v12.csv
          test -s overall_summary_v12.csv
          python - <<'PY'
          import numpy as np, pandas as pd
          d=pd.read_csv('backtest_results_v12.csv',low_memory=False)
          need=['HomeProbV12','DrawProbV12','AwayProbV12','PredictedV12','Actual']
          miss=[c for c in need if c not in d.columns]
          if miss: raise SystemExit(f'missing columns: {miss}')
          p=d[['HomeProbV12','DrawProbV12','AwayProbV12']].to_numpy(float)
          if not np.all(np.isfinite(p)) or not np.allclose(p.sum(1),1.0,atol=1e-6): raise SystemExit('invalid probability rows')
          if len(d)<100: raise SystemExit(f'too few rows: {len(d)}')
          print(f'[V12] PASS rows={len(d)}')
          PY
      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-backtest-state-v12
          path: |
            backtest.py
            v12_runner.py
            backtest_checkpoint_v9.pkl.gz
            BACKTEST_COMPLETE_V9
            BACKTEST_COMPLETE_V12
            cache/
            *_v9.csv
            *_v12.csv
          if-no-files-found: ignore
          retention-days: 90
      - name: Persist verified state
        if: always()
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtest.py v12_runner.py backtest_checkpoint_v9.pkl.gz BACKTEST_COMPLETE_V9 BACKTEST_COMPLETE_V12 '*_v9.csv' '*_v12.csv' cache/ 2>/dev/null
          if git diff --cached --quiet; then echo '[COMMIT] no changes'; else git commit -m 'Persist verified Soccer V12 state'; git push origin HEAD:main; fi

# Concurrent production rerun trigger: workflow revision only.
