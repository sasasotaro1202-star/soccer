name: Soccer Backtest V12 - Hardened Production
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: soccer-backtest-v12-production-v12
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  backtest:
    runs-on: [self-hosted, macOS, X64, soccer]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Mac runtime health gate
        run: |
          set -euo pipefail
          echo '[HEALTH] runner=$(hostname)'
          echo '[HEALTH] macOS:'; sw_vers
          echo '[HEALTH] Python:'; python3 --version
          echo '[HEALTH] Runner listener processes:'; pgrep -af 'Runner.Listener' || true
          echo '[HEALTH] Disk:'; df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          if [ "${free_kb:-0}" -lt 10485760 ]; then echo '[HEALTH] FAIL: less than 10 GiB free on workspace filesystem'; exit 20; fi
          echo '[HEALTH] Memory summary:'; vm_stat | head -20 || true
          echo '[HEALTH] CPU/load:'; uptime
          echo '[HEALTH] File descriptor limit:'; ulimit -n
          curl --fail --silent --show-error --location --max-time 20 https://api.github.com/rate_limit >/dev/null
          echo '[HEALTH] GitHub HTTPS PASS'
          curl --fail --silent --show-error --location --max-time 20 https://www.sofascore.com >/dev/null
          echo '[HEALTH] SofaScore HTTPS PASS'
      - name: Setup Python
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/soccer-v12-venv"
          python3 -m venv "$VENV"
          REQ_HASH="$(shasum -a 256 requirements.txt | awk '{print $1}')"
          echo "[DEPS] requirements_sha256=$REQ_HASH"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install -r requirements.txt
          "$VENV/bin/python" - <<'PY'
          import numpy,pandas,requests
          print('[DEPS] core imports OK')
          PY
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: V12 preflight and integrity gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('backtest.py'); s=p.read_text(encoding='utf-8'); marker='SOCCER_PRODUCTION_HARDENING_V2'
          if marker not in s:
              anchor='''    aliases={\n        "fc bayern munchen":"bayern","bayern munich":"bayern","bayern munchen":"bayern",'''
              replacement='''    aliases={\n        "man united":"manchester united","man utd":"manchester united","manchester united":"manchester united","manchester united fc":"manchester united",\n        "man city":"manchester city","manchester city":"manchester city","manchester city fc":"manchester city",\n        "tottenham":"tottenham hotspur","tottenham hotspur":"tottenham hotspur","spurs":"tottenham hotspur",\n        "newcastle":"newcastle united","west ham":"west ham united","wolves":"wolverhampton wanderers","leicester":"leicester city","leeds":"leeds united",\n        "brighton":"brighton hove albion","sheffield utd":"sheffield united","norwich":"norwich city","qpr":"queens park rangers",\n        "west brom":"west bromwich albion","huddersfield":"huddersfield town",\n        "fc bayern munchen":"bayern","bayern munich":"bayern","bayern munchen":"bayern",'''
              if anchor not in s: raise SystemExit('[PATCH] alias anchor not found')
              s=s.replace(anchor,replacement,1)
              old='''def same_team(a,b):\n    ka,kb=team_key(a),team_key(b)\n    return ka==kb or ka in kb or kb in ka\n'''
              new='''def same_team(a,b):\n    ka,kb=team_key(a),team_key(b)\n    return bool(ka) and bool(kb) and ka == kb\n'''
              if old in s: s=s.replace(old,new,1)
              elif 'ka in kb' in s: s=s.replace('    return ka==kb or ka in kb or kb in ka','    return bool(ka) and bool(kb) and ka == kb',1)
              else: raise SystemExit('[PATCH] same_team not found')
              s += '\n# ' + marker + '\n'; p.write_text(s,encoding='utf-8')
          r=Path('v12_runner.py'); rs=r.read_text(encoding='utf-8'); safeguard='V12 SAFEGUARD: prior rows only; current outcome is appended after prediction.'
          if safeguard not in rs:
              rs=rs.replace('"""Soccer Backtest V12 runner.', '"""Soccer Backtest V12 runner.\n\n'+safeguard, 1); r.write_text(rs,encoding='utf-8')
          if 'prior rows only' not in rs.lower(): raise SystemExit('[PATCH] prior-row safeguard missing')
          PY
          python understat_quality_runtime_patch.py
          python -m py_compile backtest.py v12_runner.py tests/smoke_test.py soccer_audit.py understat_quality_runtime_patch.py production_integrity_gate.py
          python tests/smoke_test.py
          python soccer_audit.py
      - name: Restore latest resumable state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os, shutil, tempfile, zipfile
          from pathlib import Path
          import requests
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          api=f'https://api.github.com/repos/{repo}'; session=requests.Session(); session.headers.update(headers); artifact=None
          for name in ('soccer-backtest-state-v12','soccer-backtest-state-v9'):
              r=session.get(f'{api}/actions/artifacts',params={'name':name,'per_page':100},timeout=60); r.raise_for_status()
              items=[a for a in r.json().get('artifacts',[]) if not a.get('expired',False)]
              if items: artifact=max(items,key=lambda a:a.get('created_at','')); break
          if not artifact: print('[STATE] no prior artifact'); raise SystemExit(0)
          print(f"[STATE] restoring artifact id={artifact['id']} name={artifact['name']} created={artifact.get('created_at')}")
          r=session.get(artifact['archive_download_url'],timeout=120); r.raise_for_status()
          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile(io.BytesIO(r.content)) as z: z.extractall(td)
              root=Path(td); checkpoint=root/'backtest_checkpoint_v9.pkl.gz'
              if checkpoint.exists(): shutil.copy2(checkpoint,Path('backtest_checkpoint_v9.pkl.gz'))
              cache=root/'cache'
              if cache.exists():
                  dst=Path('cache'); dst.mkdir(exist_ok=True)
                  for src in cache.rglob('*'):
                      rel=src.relative_to(cache); out=dst/rel
                      if src.is_dir(): out.mkdir(parents=True,exist_ok=True)
                      else: out.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,out)
              print('[STATE] restored checkpoint/cache only; source code remains from current commit')
          PY
      - name: Run V12 chronological backtest
        env:
          MAX_RUNTIME_SECONDS: "5100"
          ENABLE_SOFASCORE: "1"
          SOFASCORE_DETAILS: "0"
          ENABLE_UNDERSTAT: "1"
          INCLUDE_CLUB_FRIENDLIES: "1"
          FRIENDLY_MIN_YEAR: "2010"
          FRIENDLY_MAX_PAGES: "250"
        run: caffeinate -dimsu python v12_runner.py
      - name: Verify outputs and prediction integrity
        run: |
          set -euo pipefail
          python -m py_compile backtest.py v12_runner.py tests/smoke_test.py soccer_audit.py understat_quality_runtime_patch.py production_integrity_gate.py
          python soccer_audit.py
          test -s BACKTEST_COMPLETE_V12
          test -s backtest_results_v12.csv
          test -s overall_summary_v12.csv
          python - <<'PY'
          import numpy as np, pandas as pd
          d=pd.read_csv('backtest_results_v12.csv',low_memory=False); need=['HomeProbV12','DrawProbV12','AwayProbV12','PredictedV12','Actual']
          miss=[c for c in need if c not in d.columns]
          if miss: raise SystemExit(f'missing columns: {miss}')
          p=d[['HomeProbV12','DrawProbV12','AwayProbV12']].to_numpy(float)
          if not np.all(np.isfinite(p)) or not np.allclose(p.sum(1),1.0,atol=1e-6): raise SystemExit('invalid probability rows')
          if len(d)<100: raise SystemExit(f'too few rows: {len(d)}')
          print(f'[V12] PASS rows={len(d)}')
          PY
          python production_integrity_gate.py
      - name: Upload verified state artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-backtest-state-v12
          path: |
            backtest_checkpoint_v9.pkl.gz
            cache/
            backtest_results_v12.csv
            overall_summary_v12.csv
            production_run_manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload failure diagnostics without touching production state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-backtest-failure-${{ github.run_id }}
          path: |
            backtest_results_v12.csv
            overall_summary_v12.csv
            BACKTEST_COMPLETE_V12
            backtest_checkpoint_v9.pkl.gz
            cache/
            production_run_manifest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist verified state atomically
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtest_checkpoint_v9.pkl.gz cache/ production_run_manifest.json
          if git diff --cached --quiet; then echo '[COMMIT] no verified state changes'; exit 0; fi
          git commit -m 'Persist verified Soccer V12 state'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then echo "[PERSIST] verified state push succeeded on attempt $attempt"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo '[PERSIST] verified state push failed after 5 attempts'; exit 1
