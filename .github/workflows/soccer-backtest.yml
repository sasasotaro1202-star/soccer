name: Soccer Backtest V12 - Strong Auto Resume

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: soccer-backtest-v12-auto
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Materialize V12 source
        shell: bash
        run: |
          set -euo pipefail
          cat v12_payload/part*.b64 | tr -d '\n' | base64 -d | gzip -d > /tmp/backtest_v12.py
          echo "223b700d88a9046c55f9a9d9ec0f058c5a72819db5091e600c59d84bf3e79ecf  /tmp/backtest_v12.py" | sha256sum -c -
          mv /tmp/backtest_v12.py backtest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest.py
          git commit -m "Promote soccer backtest source to V12"
          git push origin HEAD:main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight tests
        run: |
          python -m py_compile backtest.py
          python tests/smoke_test.py

      - name: Run V12 chronological backtest
        env:
          MAX_RUNTIME_SECONDS: "1620"
          ENABLE_SOFASCORE: "1"
          SOFASCORE_DETAILS: "0"
          ENABLE_UNDERSTAT: "1"
          INCLUDE_CLUB_FRIENDLIES: "1"
          FRIENDLY_MIN_YEAR: "2010"
          FRIENDLY_MAX_PAGES: "250"
        run: python backtest.py

      - name: Save V12 automatic state artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: soccer-backtest-state-v12
          path: |
            backtest_checkpoint_v12.pkl.gz
            BACKTEST_COMPLETE_V12
            *_v12.csv
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 6

      - name: Disable schedule after full completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f BACKTEST_COMPLETE_V12 ]; then
            gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}" || true
          fi
