name: Soccer Research Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
