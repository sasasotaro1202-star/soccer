name: Soccer Research Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run research loop
        run: python research_loop.py

      - name: Save research state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research_state.json research_history.json || true
          git commit -m "Update soccer research state" || true
          git push || true
