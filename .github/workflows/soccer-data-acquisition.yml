name: Soccer Source Acquisition
on:
  workflow_dispatch:
  push:
    paths:
      - 'control/soccer-acquisition-trigger.txt'
  schedule:
    - cron: '7 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: soccer-source-acquisition
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  acquire:
    runs-on: [self-hosted, macOS, X64, soccer]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup persistent Python acquisition environment
        run: |
          set -euo pipefail
          VENV="$HOME/actions-runner/_toolcache/soccer-acquisition-venv"
          STAMP="$VENV/.requirements.sha256"
          REQ_HASH="$(shasum -a 256 requirements.txt | awk '{print $1}')"
          mkdir -p "$(dirname "$VENV")"
          if [ ! -x "$VENV/bin/python" ] || [ ! -f "$STAMP" ] || [ "$(cat "$STAMP" 2>/dev/null || true)" != "$REQ_HASH" ]; then
            echo '[DEPS] Creating/updating persistent soccer acquisition venv'
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/python" -m pip install -r requirements.txt
            printf '%s' "$REQ_HASH" > "$STAMP"
          else
            echo '[DEPS] Reusing persistent soccer acquisition venv'
          fi
          "$VENV/bin/python" - <<'PY'
          import numpy, pandas, requests, curl_cffi
          print('[DEPS] soccer acquisition imports OK')
          PY
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Acquisition preflight
        run: |
          set -euo pipefail
          python3 --version
          python -m py_compile soccer_source_acquisition_v2.py
          python - <<'PY'
          import numpy, pandas, requests, curl_cffi
          print('[PREFLIGHT] core Python dependencies OK')
          PY
      - name: Acquire and validate full-scope source data
        env:
          ACQ_TIMEOUT: "20"
          ACQ_RETRIES: "5"
          ACQ_CACHE_TTL_SEC: "43200"
          ACQ_START_SEASON: "2010"
          ACQ_END_SEASON: "2025"
        run: caffeinate -dimsu python soccer_source_acquisition_v2.py
      - name: Validate acquisition health manifest
        if: always()
        run: |
          set -euo pipefail
          test -s data_source_health.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data_source_health.json')
          d=json.loads(p.read_text())
          print('[ACQ HEALTH] scope=', d.get('scope'))
          print('[ACQ HEALTH] sources=', sorted(d.get('sources',{})))
          for name, info in d.get('sources',{}).items():
              if isinstance(info, dict) and 'failed_seasons' in info:
                  print('[ACQ HEALTH]', name, 'failed=', info.get('failed_seasons'))
              if name == 'sofascore_scheduled_events':
                  print('[ACQ HEALTH] SofaScore events=', info.get('events'), 'status=', info.get('status'))
          PY
      - name: Persist acquisition cache
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/ data_source_health.json soccer_source_acquisition_v2.py
          if git diff --cached --quiet; then echo '[ACQ] no cache changes'; exit 0; fi
          git commit -m 'Harden full-scope Soccer source acquisition'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soccer-source-acquisition-${{ github.run_id }}
          path: |
            data_source_health.json
            cache/
          if-no-files-found: ignore
          retention-days: 30
