name: Soccer Autonomous Self-Heal

on:
  workflow_run:
    workflows:
      - Soccer Backtest V12 - Hardened Production
      - Soccer V12 Autonomous Research AI
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: soccer-self-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect and retry failed autonomous jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TARGET_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TARGET_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          mkdir -p self_heal
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo '{"version":"soccer-self-heal-v1","time":"'"$now"'"}' > self_heal/latest.json
          if [ -n "${TARGET_RUN_ID}" ] && [ "${TARGET_CONCLUSION}" = "failure" ] && [ "${TARGET_ATTEMPT:-1}" -lt 3 ]; then
            echo "Retrying failed workflow run ${TARGET_RUN_ID} (${TARGET_WORKFLOW}), attempt ${TARGET_ATTEMPT}" | tee -a self_heal/latest.log
            gh run rerun "${TARGET_RUN_ID}" --failed --repo "${repo}"
          else
            echo "No automatic retry required. run=${TARGET_RUN_ID:-scheduled} conclusion=${TARGET_CONCLUSION:-n/a} attempt=${TARGET_ATTEMPT:-n/a}" | tee -a self_heal/latest.log
          fi
          gh run list --repo "${repo}" --limit 10 --json databaseId,name,status,conclusion,attempt,createdAt,headSha > self_heal/recent_runs.json

      - name: Persist self-heal diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add self_heal/latest.json self_heal/latest.log self_heal/recent_runs.json
          git diff --cached --quiet || git commit -m 'Record soccer autonomous self-heal diagnostics'
          git push
