name: Soccer Autonomous Self-Heal

on:
  workflow_run:
    workflows:
      - Soccer Backtest V12 - Hardened Production
      - Soccer V12 Autonomous Research AI
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: soccer-self-heal-v2
  cancel-in-progress: false

jobs:
  heal:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify self-heal runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          command -v python3
          command -v curl
          echo '[SELF-HEAL] self-hosted Intel Mac runner OK; using Python stdlib + GitHub REST API.'
      - name: Diagnose, retry and close any broken chain
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p self_heal
          python3 - <<'PY'
          import json, os, ssl, urllib.request, time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; ctx=ssl.create_default_context()
          def req(path, method='GET', data=None):
              r=urllib.request.Request(api+path, method=method, headers=headers)
              if data is not None: r.data=json.dumps(data).encode(); r.add_header('Content-Type','application/json')
              with urllib.request.urlopen(r, context=ctx, timeout=30) as x:
                  raw=x.read(); return json.loads(raw) if raw else {}
          now=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()); event_id=os.environ.get('EVENT_RUN_ID',''); event_conclusion=os.environ.get('EVENT_CONCLUSION',''); event_attempt=int(os.environ.get('EVENT_ATTEMPT','1') or 1); event_workflow=os.environ.get('EVENT_WORKFLOW','scheduled')
          print(f'[HEAL] {now} event={event_workflow} run={event_id or "none"} conclusion={event_conclusion or "none"} attempt={event_attempt}')
          if event_id and event_conclusion == 'failure' and event_attempt < 3:
              try: req(f'/actions/runs/{event_id}/rerun-failed-jobs','POST'); print(f'[HEAL] requested rerun-failed-jobs for {event_id}')
              except Exception as e: print(f'[HEAL] rerun request failed: {e}')
          runs=req('/actions/runs?per_page=50')['workflow_runs']
          active=[r for r in runs if r['name'] in ('Soccer Backtest V12 - Hardened Production','Soccer V12 Autonomous Research AI') and r['status'] in ('in_progress','queued','waiting','requested')]
          prod=max([r for r in runs if r['name']=='Soccer Backtest V12 - Hardened Production' and r['status']=='completed'],key=lambda r:r['created_at'],default=None)
          research=max([r for r in runs if r['name']=='Soccer V12 Autonomous Research AI' and r['status']=='completed'],key=lambda r:r['created_at'],default=None)
          action='none'; dispatch_status='not-needed'; dispatch_workflow='none'
          if active: action='none-active'; print('[HEAL] autonomous stage already active; no dispatch')
          else:
              def dispatch(workflow_file):
                  global dispatch_status, dispatch_workflow
                  try: req(f'/actions/workflows/{workflow_file}/dispatches','POST',{'ref':'main'}); dispatch_status='success'; dispatch_workflow=workflow_file; print(f'[HEAL] dispatched {workflow_file}')
                  except Exception as e: dispatch_status='failed'; dispatch_workflow=workflow_file; print(f'[HEAL] dispatch failed for {workflow_file}: {e}')
              if prod and prod.get('conclusion') in ('failure','cancelled','timed_out') and (event_id != str(prod['id']) or event_attempt >= 3): action='dispatch-production-recovery'; dispatch('soccer-backtest.yml')
              elif prod and prod.get('conclusion')=='success' and (not research or research['created_at'] < prod['created_at']): action='dispatch-research'; dispatch('soccer-research-ai.yml')
              elif research and research.get('conclusion')=='success' and (not prod or prod['created_at'] < research['created_at']): action='dispatch-production'; dispatch('soccer-backtest.yml')
          latest={'version':'soccer-self-heal-v9','time':now,'action':action,'dispatch_status':dispatch_status,'dispatch_workflow':dispatch_workflow,'production_active':sum(r['name']=='Soccer Backtest V12 - Hardened Production' for r in active),'research_active':sum(r['name']=='Soccer V12 Autonomous Research AI' for r in active),'latest_production_run':prod['id'] if prod else None,'latest_production_conclusion':prod['conclusion'] if prod else None,'latest_research_run':research['id'] if research else None,'latest_research_conclusion':research['conclusion'] if research else None}
          Path('self_heal/latest.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); Path('self_heal/recent_runs.json').write_text(json.dumps(runs,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Persist self-heal diagnostics
        if: always()
        run: |
          set +e
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add self_heal/latest.json self_heal/recent_runs.json 2>/dev/null
          if git diff --cached --quiet; then echo '[SELF-HEAL] no diagnostic changes.'; else git commit -m 'Record soccer autonomous self-heal diagnostics'; git push; fi
