name: Soccer Operations Status Snapshot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: soccer-ops-status
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Build status snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          names=['Soccer Backtest V12 - Hardened Production','Soccer V12 Autonomous Research AI','Soccer Self-Heal']
          out={'schema':'soccer-ops-v1','created_at_utc':datetime.now(timezone.utc).isoformat(),'workflows':{}}
          for name in names:
              url=f'https://api.github.com/repos/{repo}/actions/runs?per_page=100'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              runs=[x for x in data.get('workflow_runs',[]) if x.get('name')==name]
              active=[x for x in runs if x.get('status') in {'queued','waiting','requested','in_progress'}]
              completed=[x for x in runs if x.get('status')=='completed']
              out['workflows'][name]={'active':active[:10],'last_completed':completed[0] if completed else None}
          os.makedirs('ops',exist_ok=True)
          open('ops/soccer_status.json','w').write(json.dumps(out,indent=2))
          PY
      - name: Upload status snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soccer-ops-status-${{ github.run_id }}
          path: ops/soccer_status.json
          retention-days: 30
