name: Integrated Soccer Pipeline
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect soccer data (football-data.co.uk / understat / sofascore)
        run: python soccer_source_acquisition_v2.py || echo "acquisition script failed, continuing"
      - name: Data quality gate
        run: python production_data_quality_gate.py || echo "quality gate reported issues, continuing"
      - name: Upload collected data
        uses: actions/upload-artifact@v4
        with:
          name: soccer-data
          path: |
            data_coverage.csv
            competition_season_summary.csv
          if-no-files-found: warn

  backtest:
    needs: [collect]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backtest
        run: python backtest.py
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: soccer-backtest-results
          path: |
            model_comparison.csv
            score_summary.csv
            season_summary.csv
            overall_summary.csv
            feature_importance.csv
          if-no-files-found: warn

  audit:
    needs: [backtest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run integrity gate
        run: python production_integrity_gate.py || echo "integrity gate reported issues"
      - name: Run audit
        run: python soccer_audit.py || echo "audit reported issues"
