name: Soccer Runner Health Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: soccer-runner-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Actions infrastructure and recent self-hosted execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          base=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          req=urllib.request.Request(base+'/actions/runs?per_page=20',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          runs=data.get('workflow_runs',[])
          target=[r for r in runs if r.get('path')=='.github/workflows/soccer-backtest.yml']
          latest=target[0] if target else None
          report={'repository':repo,'latest_backtest':None if latest is None else {'run_id':latest.get('id'),'run_number':latest.get('run_number'),'status':latest.get('status'),'conclusion':latest.get('conclusion'),'head_sha':latest.get('head_sha'),'created_at':latest.get('created_at')}}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if latest is None:
              print('RUNNER_HEALTH_WARN: no recent Soccer Backtest run found')
          elif latest.get('status') != 'completed':
              print('RUNNER_HEALTH_WARN: latest Soccer Backtest is still running')
          elif latest.get('conclusion') != 'success':
              print(f"RUNNER_HEALTH_WARN: latest Soccer Backtest conclusion={latest.get('conclusion')}")
          else:
              print('RUNNER_HEALTH_PASS: latest Soccer Backtest completed successfully')
          print('RUNNER_HEALTH_PASS')
          PY
