name: Soccer V12 Autonomous Research AI

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v12_auto_research.py'
      - 'engine/**'
      - '.github/workflows/soccer-research-ai.yml'

permissions:
  contents: write

concurrency:
  group: soccer-v12-research
  cancel-in-progress: false

jobs:
  research:
    name: V12 autonomous evaluation and research
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MAX_RUNTIME_SECONDS: '3300'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Preflight
        run: |
          python -m py_compile v12_auto_research.py engine/*.py

      - name: Run V12 autonomous research
        run: python v12_auto_research.py

      - name: Save research state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_state.json research_history.json evaluation.json failure_analysis.json candidate_models.json model_comparison_v12.json model_registry.json || true
          git commit -m 'Update soccer V12 autonomous research state' || true
          git push || true

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soccer-v12-research-${{ github.run_id }}
          path: |
            evaluation.json
            failure_analysis.json
            candidate_models.json
            candidate_evaluations.json
            model_comparison_v12.json
            model_registry.json
            research_state.json
            research_history.json
          if-no-files-found: warn
          retention-days: 30
