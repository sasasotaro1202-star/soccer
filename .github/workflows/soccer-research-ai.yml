name: Soccer V12 Autonomous Research AI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-v12-research
  cancel-in-progress: false

jobs:
  research:
    name: V12 autonomous evaluation and research on Mac
    runs-on: [self-hosted, macOS, X64, soccer]
    timeout-minutes: 60
    env:
      MAX_RUNTIME_SECONDS: '3300'
      CANDIDATE_RETRAIN_EVERY: '150'
      CANDIDATE_MIN_TRAIN: '260'
      PYTHONUNBUFFERED: '1'
      RESEARCH_RUNNER: macOS-self-hosted
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Mac runtime health gate
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          echo '[HEALTH] Disk:'; df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          if [ "${free_kb:-0}" -lt 10485760 ]; then echo '[HEALTH] FAIL: less than 10 GiB free'; exit 20; fi
          echo '[HEALTH] Memory:'; vm_stat | head -20 || true
          echo '[HEALTH] Load:'; uptime
          curl --fail --silent --show-error --location --max-time 20 https://api.github.com/rate_limit >/dev/null
          echo '[HEALTH] GitHub HTTPS PASS'
      - name: Verify Mac runner
        run: |
          set -euo pipefail
          pgrep -af 'Runner.Listener' || true
          python3 --version
          echo 'Mac self-hosted research runner verified'
      - name: Verify OpenAI secret is available
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY GitHub Secret is not configured"; exit 1; }
          echo "OpenAI API secret detected; value is intentionally not printed."
      - name: Setup Python environment
        run: |
          set -euo pipefail
          python3 -m venv .venv-research
          . .venv-research/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Research input integrity gate
        run: |
          set -euo pipefail
          test -s BACKTEST_COMPLETE_V12
          test -s backtest_results_v12.csv
          test -s overall_summary_v12.csv
          python3 - <<'PY'
          import numpy as np, pandas as pd
          p=pd.read_csv('backtest_results_v12.csv',low_memory=False)
          need=['HomeProbV12','DrawProbV12','AwayProbV12','PredictedV12','Actual']
          missing=[c for c in need if c not in p.columns]
          if missing: raise SystemExit(f'missing V12 columns: {missing}')
          probs=p[['HomeProbV12','DrawProbV12','AwayProbV12']].to_numpy(float)
          if not np.all(np.isfinite(probs)) or not np.allclose(probs.sum(1),1.0,atol=1e-6): raise SystemExit('invalid V12 probability rows')
          if len(p) < 100: raise SystemExit(f'suspiciously small V12 output: {len(p)}')
          print(f'research input integrity PASS rows={len(p)}')
          PY
      - name: Preflight
        run: |
          set -euo pipefail
          . .venv-research/bin/activate
          python -m py_compile v12_auto_research.py openai_research_advisor.py v12_runner.py engine/*.py
          python - <<'PY'
          import ast,glob
          for p in ['v12_auto_research.py','openai_research_advisor.py']+glob.glob('engine/*.py'):
              ast.parse(open(p,encoding='utf-8').read(),filename=p)
          print('research preflight: PASS')
          PY
      - name: Run V12 autonomous research with bounded retries
        run: |
          set -euo pipefail
          . .venv-research/bin/activate
          for attempt in 1 2 3; do
            if python v12_auto_research.py; then exit 0; fi
            echo "[RESEARCH] attempt ${attempt}/3 failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Generate OpenAI research advisory
        run: |
          set -euo pipefail
          . .venv-research/bin/activate
          python openai_research_advisor.py
          python -m json.tool research_ai_advice.json >/dev/null
      - name: Validate research outputs
        run: |
          set -euo pipefail
          test -s evaluation.json
          test -s failure_analysis.json
          test -s condition_analysis_v12.json
          test -s candidate_models.json
          test -s candidate_evaluations.json
          test -s model_comparison_v12.json
          test -s model_registry.json
          test -s research_manifest.json
          test -s research_ai_advice.json
          python3 - <<'PY'
          import json
          p=json.load(open('candidate_evaluations.json',encoding='utf-8'))
          assert p.get('leak_policy') == 'prior_rows_only'
          assert isinstance(p.get('candidates'),list) and p['candidates']
          c=json.load(open('model_comparison_v12.json',encoding='utf-8'))
          assert c.get('fail_closed') is True
          m=json.load(open('research_manifest.json',encoding='utf-8'))
          assert m.get('policy') == 'prior_rows_only'
          a=json.load(open('research_ai_advice.json',encoding='utf-8'))
          assert a.get('advisory_only') is True
          assert a.get('source_policy') == 'prior_rows_only'
          print('candidate OOS + fail-closed promotion gate + provenance + OpenAI advisory: PASS')
          PY
      - name: Save research state with conflict recovery
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_state.json research_history.json research_manifest.json research_ai_advice.json evaluation.json failure_analysis.json condition_analysis_v12.json candidate_models.json candidate_evaluations.json model_comparison_v12.json model_registry.json
          if git diff --cached --quiet; then echo '[COMMIT] no research-state changes.'; exit 0; fi
          git commit -m 'Update soccer V12 autonomous research state'
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soccer-v12-research-${{ github.run_id }}
          path: |
            evaluation.json
            failure_analysis.json
            condition_analysis_v12.json
            candidate_models.json
            candidate_evaluations.json
            model_comparison_v12.json
            model_registry.json
            research_state.json
            research_history.json
            research_manifest.json
            research_ai_advice.json
          if-no-files-found: ignore
          retention-days: 30
