name: Soccer V12 Autonomous Research AI

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v12_auto_research.py'
      - 'engine/**'
      - 'backtest_results_v12.csv'
      - 'overall_summary_v12.csv'
      - 'league_season_summary_v12.csv'
      - '.github/workflows/soccer-research-ai.yml'

permissions:
  contents: write

concurrency:
  group: soccer-v12-research
  cancel-in-progress: false

jobs:
  research:
    name: V12 autonomous evaluation and research
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_RUNTIME_SECONDS: '3300'
      CANDIDATE_RETRAIN_EVERY: '150'
      CANDIDATE_MIN_TRAIN: '260'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Preflight
        run: |
          python -m py_compile v12_auto_research.py v12_runner.py engine/*.py
          python - <<'PY'
          import ast,glob
          for p in ['v12_auto_research.py']+glob.glob('engine/*.py'):
              ast.parse(open(p,encoding='utf-8').read(),filename=p)
          print('research preflight: PASS')
          PY

      - name: Run V12 autonomous research
        run: python v12_auto_research.py

      - name: Validate research outputs
        run: |
          test -s evaluation.json
          test -s failure_analysis.json
          test -s condition_analysis_v12.json
          test -s candidate_models.json
          test -s candidate_evaluations.json
          test -s model_comparison_v12.json
          test -s model_registry.json
          python - <<'PY'
          import json
          p=json.load(open('candidate_evaluations.json',encoding='utf-8'))
          assert p.get('leak_policy') == 'prior_rows_only'
          assert isinstance(p.get('candidates'),list) and p['candidates']
          c=json.load(open('model_comparison_v12.json',encoding='utf-8'))
          assert c.get('fail_closed') is True
          print('candidate OOS + fail-closed promotion gate: PASS')
          PY

      - name: Save research state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_state.json research_history.json evaluation.json failure_analysis.json condition_analysis_v12.json candidate_models.json candidate_evaluations.json model_comparison_v12.json model_registry.json
          git diff --cached --quiet || git commit -m 'Update soccer V12 autonomous research state'
          git push

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: soccer-v12-research-${{ github.run_id }}
          path: |
            evaluation.json
            failure_analysis.json
            condition_analysis_v12.json
            candidate_models.json
            candidate_evaluations.json
            model_comparison_v12.json
            model_registry.json
            research_state.json
            research_history.json
          if-no-files-found: ignore
          retention-days: 30
