name: Soccer Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          python backtest.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-backtest-results
          path: |
            *.csv
            *.pkl
            cache/
          if-no-files-found: ignore